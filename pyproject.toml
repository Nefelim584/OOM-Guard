[project]
name = "oom-guard"
version = "0.1.0"
description = "Adaptive Context Compressor MCP (ACC-MCP)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.0.0",
    "tiktoken>=0.7.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/acc_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", ".venv/lib/python3.12/site-packages"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
